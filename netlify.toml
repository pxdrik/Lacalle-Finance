[build]
  command = "npm run build"
  publish = "dist"

# O app não usa rotas (é uma página só), mas isso evita erro 404 caso você
# adicione roteamento no futuro — qualquer caminho cai de volta no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança aplicados a todo o site. `connect-src`/`script-src`
# incluem *.supabase.co (API/autenticação/edge functions) e o domínio do
# Cloudflare Turnstile (usado só se o CAPTCHA opcional — ver AuthScreen.jsx —
# estiver configurado; inofensivo deixá-lo aqui mesmo se não estiver em uso).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
